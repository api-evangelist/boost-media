name: Boost Media
description: Boost Media (formerly BoostCTR) was a digital-advertising creative-optimization SaaS
  platform that paired machine-learning analysis with a curated marketplace of more than 1,000 human
  writers and designers to test and improve ad creative across paid search, social, video, and display
  campaigns. Its technology powered roughly $1 billion in paid-search advertising for around 100 global
  brands across retail, education, financial services, healthcare and insurance, gaming, auto, and
  travel. Backed by Battery Ventures (Series C, $19M, 2014), Founder Collective, and 500 Global, the
  company raised about $42.8M total before being acquired by AdLabs Technology in April 2019. The
  company is now closed; its former domain (boostmedia.com) has been released and now serves a GoDaddy
  parking lander, and the acquirer's own domain (adlabs.ai) no longer resolves. This profile is
  retained as a Battery Ventures portfolio record. No public API, developer portal, or specification
  surface exists to enrich — the Internet Archive record of boostmedia.com shows a WordPress marketing
  site and blog only, with no developer, docs, or API path ever published.
